<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Two-phase training with Keras callbacks</title>
  <desc id="desc">Animated validation-loss curve over two training phases with markers for learning-rate reductions, early stopping and restored best weights.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mut { fill: #8b949e; }

  </style>
  <rect width="1200" height="470" rx="14" fill="#0d1117"/>
  <rect width="1200" height="470" rx="14" fill="url(#grid)"/>
  <text x="30" y="40" class="t" font-size="20" font-weight="700">train.py: two-phase transfer learning</text>
  <text x="30" y="62" class="t mut" font-size="13">The val_loss values are illustrative. Every marker is the decision Keras 3 takes on them with the callbacks configured in train.py.</text>
  <rect x="78.0" y="84" width="361.4" height="50" rx="8" fill="#13233a" stroke="#1f6feb"/>
  <text x="82.8" y="104" class="t" font-size="13" font-weight="700">Phase 1 · head only, up to 15 epochs</text>
  <text x="82.8" y="124" class="t m mut" font-size="11">backbone frozen · Adam 1e-4</text>
  <rect x="439.3" y="84" width="722.7" height="50" rx="8" fill="#1f1530" stroke="#8957e5"/>
  <text x="444.1" y="104" class="t" font-size="13" font-weight="700">Phase 2 · fine-tune all layers, up to 30 epochs</text>
  <text x="444.1" y="124" class="t m mut" font-size="11">recompiled · Adam 1e-5 · fresh callbacks</text>
  <line x1="90" y1="320.5" x2="1150" y2="320.5" stroke="#21262d"/>
  <text x="82" y="324.5" class="t m mut" font-size="10" text-anchor="end">0.8</text>
  <line x1="90" y1="282.6" x2="1150" y2="282.6" stroke="#21262d"/>
  <text x="82" y="286.6" class="t m mut" font-size="10" text-anchor="end">1.0</text>
  <line x1="90" y1="244.7" x2="1150" y2="244.7" stroke="#21262d"/>
  <text x="82" y="248.7" class="t m mut" font-size="10" text-anchor="end">1.2</text>
  <line x1="90" y1="206.8" x2="1150" y2="206.8" stroke="#21262d"/>
  <text x="82" y="210.8" class="t m mut" font-size="10" text-anchor="end">1.4</text>
  <line x1="90" y1="168.9" x2="1150" y2="168.9" stroke="#21262d"/>
  <text x="82" y="172.9" class="t m mut" font-size="10" text-anchor="end">1.6</text>
  <text x="40" y="240" class="t mut" font-size="11" transform="rotate(-90 40 240)" text-anchor="middle">val_loss</text>
  <text x="90.0" y="346" class="t m mut" font-size="10" text-anchor="middle">1</text>
  <text x="210.5" y="346" class="t m mut" font-size="10" text-anchor="middle">6</text>
  <text x="330.9" y="346" class="t m mut" font-size="10" text-anchor="middle">11</text>
  <text x="451.4" y="346" class="t m mut" font-size="10" text-anchor="middle">16</text>
  <text x="571.8" y="346" class="t m mut" font-size="10" text-anchor="middle">21</text>
  <text x="692.3" y="346" class="t m mut" font-size="10" text-anchor="middle">26</text>
  <text x="812.7" y="346" class="t m mut" font-size="10" text-anchor="middle">31</text>
  <text x="933.2" y="346" class="t m mut" font-size="10" text-anchor="middle">36</text>
  <text x="1053.6" y="346" class="t m mut" font-size="10" text-anchor="middle">41</text>
  <text x="1150" y="360" class="t mut" font-size="10.5" text-anchor="end">global epoch</text>
  <clipPath id="reveal"><rect x="0" y="0" width="0" height="460"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.8;0.95;1" values="90;1160;1160;90"/></rect></clipPath>
  <polyline clip-path="url(#reveal)" points="90.0,165.2 114.1,204.9 138.2,231.5 162.3,248.5 186.4,259.9 210.5,266.5 234.5,269.4 258.6,268.6 282.7,269.2 306.8,269.3 330.9,268.2 355.0,269.0 379.1,276.8 403.2,280.4 427.3,281.7 451.4,288.3 475.5,299.7 499.5,306.9 523.6,310.9 547.7,313.3 571.8,313.3 595.9,312.6 620.0,313.1 644.1,313.2 668.2,312.8 692.3,318.3 716.4,320.3 740.5,319.6 764.5,320.0 788.6,318.8 812.7,320.1 836.8,319.4 860.9,319.8 885.0,319.2 909.1,319.6 933.2,319.0 957.3,319.4" fill="none" stroke="#39d0d8" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="82" y="376.0" class="t m mut" font-size="10" text-anchor="end">1e-4</text>
  <text x="82" y="412.9" class="t m mut" font-size="10" text-anchor="end">1e-5</text>
  <text x="40" y="396" class="t mut" font-size="11" transform="rotate(-90 40 396)" text-anchor="middle">lr</text>
  <path clip-path="url(#reveal)" d="M90.0,372.0 H102.0 L102.0,372.0 H126.1 L126.1,372.0 H150.2 L150.2,372.0 H174.3 L174.3,372.0 H198.4 L198.4,372.0 H222.5 L222.5,372.0 H246.6 L246.6,372.0 H270.7 L270.7,372.0 H294.8 L294.8,372.0 H318.9 L318.9,372.0 H343.0 L343.0,372.0 H367.0 L367.0,383.1 H391.1 L391.1,383.1 H415.2 L415.2,383.1 H439.3 L439.3,408.9 H463.4 L463.4,408.9 H487.5 L487.5,408.9 H511.6 L511.6,408.9 H535.7 L535.7,408.9 H559.8 L559.8,408.9 H583.9 L583.9,408.9 H608.0 L608.0,408.9 H632.0 L632.0,408.9 H656.1 L656.1,408.9 H680.2 L680.2,420.0 H704.3 L704.3,420.0 H728.4 L728.4,420.0 H752.5 L752.5,420.0 H776.6 L776.6,420.0 H800.7 L800.7,420.0 H824.8 L824.8,420.0 H848.9 L848.9,431.1 H873.0 L873.0,431.1 H897.0 L897.0,431.1 H921.1 L921.1,431.1 H945.2 L945.2,431.1 H957.3" fill="none" stroke="#d29922" stroke-width="2"/>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.2000;0.2200;0.95;1" values="0;0;1;1;0"/><line x1="355.0" y1="144" x2="355.0" y2="420" stroke="#d29922" stroke-dasharray="4 4"/><text x="349.0" y="152" class="t" font-size="11.5" style="fill:#d29922" text-anchor="end">ReduceLROnPlateau: lr × 0.5</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.4364;0.4564;0.95;1" values="0;0;1;1;0"/><line x1="668.2" y1="144" x2="668.2" y2="420" stroke="#d29922" stroke-dasharray="4 4"/><text x="662.2" y="168" class="t" font-size="11.5" style="fill:#d29922" text-anchor="end">ReduceLROnPlateau: lr × 0.5</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5636;0.5836;0.95;1" values="0;0;1;1;0"/><line x1="836.8" y1="144" x2="836.8" y2="420" stroke="#d29922" stroke-dasharray="4 4"/><text x="830.8" y="184" class="t" font-size="11.5" style="fill:#d29922" text-anchor="end">ReduceLROnPlateau: lr × 0.5</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.6545;0.6745;0.95;1" values="0;0;1;1;0"/><line x1="957.3" y1="144" x2="957.3" y2="420" stroke="#f85149" stroke-dasharray="4 4"/><text x="951.3" y="152" class="t" font-size="11.5" style="fill:#f85149" text-anchor="end">EarlyStopping</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.2545;0.2745;0.95;1" values="0;0;1;1;0"/><circle cx="427.3" cy="281.7" r="6" fill="none" stroke="#3fb950" stroke-width="2"/><text x="427.3" y="269.7" class="t" font-size="11" style="fill:#3fb950" text-anchor="middle">best val_loss: weights restored</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.6545;0.6745;0.95;1" values="0;0;1;1;0"/><circle cx="716.4" cy="320.3" r="6" fill="none" stroke="#3fb950" stroke-width="2"/><text x="716.4" y="342.3" class="t" font-size="11" style="fill:#3fb950" text-anchor="middle">best val_loss: weights restored</text></g>
  <text x="30" y="452" class="t mut" font-size="12">ModelCheckpoint keeps the best val_accuracy per phase in checkpoints/. Phase 2 stopped at global epoch 37; the remaining epochs are never run.</text>
</svg>
