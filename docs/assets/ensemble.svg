<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy-weighted ensemble</title>
  <desc id="desc">Three model probability vectors are combined into the ensemble vector using weights proportional to the declared accuracies.</desc>
