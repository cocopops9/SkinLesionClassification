  <text x="30" y="420" class="t" font-size="13">Individually, InceptionResNetV2 prefers NV; the weighted mean selects MEL (0.433) and the second class NV (0.312) is reported as "Differential Consideration" because it exceeds 0.10.</text>
  <text x="30" y="442" class="t mut" font-size="12">Because the three weights differ by less than 0.025, the ensemble is close to a plain arithmetic mean. The UI default ensemble is EfficientNetB3 + InceptionV3 (w = 0.503, 0.497).</text>
