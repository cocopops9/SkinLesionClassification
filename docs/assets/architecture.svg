<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Network architecture</title>
  <desc id="desc">An ImageNet backbone without its top produces a feature tensor that goes through global average pooling, Dense 256 ReLU, Dropout 0.2, Dense 128 ReLU, Dropout 0.1 and a Dense 7 softmax layer. Activation pulses travel left to right; dropped units blink.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <radialGradient id="lesion" cx="45%" cy="45%" r="60%">
      <stop offset="0" stop-color="#24140d"/>
      <stop offset="1" stop-color="#8d5c42"/>
    </radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f3b5c"/>
      <stop offset="1" stop-color="#2d5a8a"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#39d0d8"/>
      <stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mut { fill: #8b949e; }
    .slab { animation: slab 4s ease-in-out infinite; }
    @keyframes slab { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .drop { animation: drop 1.6s steps(1) infinite; }
    @keyframes drop { 0%, 49% { fill: #161b22; } 50%, 100% { fill: #58a6ff; } }
    .win { animation: win 4s ease infinite; }
    @keyframes win { 0%, 55% { fill: #58a6ff; } 70%, 100% { fill: #f85149; } }
    @media (prefers-reduced-motion: reduce) { .slab, .drop, .win { animation: none; } .pulse { display: none; } }
  </style>

  <rect width="1200" height="460" rx="14" fill="#0d1117"/>
  <rect width="1200" height="460" rx="14" fill="url(#grid)"/>
  <text x="30" y="40" class="t" font-size="20" font-weight="700">MelanomaClassifier.build_model: pretrained backbone + classification head</text>
  <text x="30" y="62" class="t mut" font-size="13">The same graph is built in train.py (weights='imagenet') and in classification.py (weights=None, then load_weights from the .h5 file).</text>

  <!-- input -->
  <rect x="30" y="130" width="110" height="110" rx="6" fill="#d9a98d"/>
  <path d="M85 152 C 108 150, 124 170, 120 190 C 118 208, 100 222, 82 222 C 62 222, 50 204, 52 186 C 54 166, 66 154, 85 152 Z" fill="url(#lesion)"/>
  <text x="85" y="266" class="t m" font-size="11" text-anchor="middle">224×224×3</text>
  <text x="85" y="282" class="t m mut" font-size="10" text-anchor="middle">or 299×299×3</text>

  <!-- backbone -->
  <g>
    <rect class="slab" x="180" y="110" width="26" height="150" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <rect class="slab" style="animation-delay: .3s" x="222" y="120" width="32" height="130" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <rect class="slab" style="animation-delay: .6s" x="270" y="132" width="40" height="106" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <rect class="slab" style="animation-delay: .9s" x="326" y="144" width="48" height="82" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <rect class="slab" style="animation-delay: 1.2s" x="390" y="154" width="58" height="62" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <rect class="slab" style="animation-delay: 1.5s" x="464" y="162" width="70" height="46" rx="3" fill="url(#slab)" stroke="#58a6ff" stroke-opacity="0.4"/>
    <text x="357" y="96" class="t" font-size="14" font-weight="700" text-anchor="middle">backbone, include_top=False</text>
    <text x="357" y="282" class="t mut" font-size="11.5" text-anchor="middle">EfficientNetB3 · InceptionV3 · InceptionResNetV2</text>
    <text x="357" y="300" class="t m mut" font-size="10.5" text-anchor="middle">frozen in phase 1, trainable in phase 2 · dropout is active only in training</text>
  </g>

  <!-- feature tensor -->
  <g>
    <path d="M570 160 L600 140 L660 140 L630 160 Z" fill="#2d5a8a"/>
    <path d="M630 160 L660 140 L660 200 L630 220 Z" fill="#1f3b5c"/>
    <rect x="570" y="160" width="60" height="60" fill="#3b6ea5"/>
    <text x="614" y="250" class="t m" font-size="10.5" text-anchor="middle">7×7×1536</text>
    <text x="614" y="265" class="t m mut" font-size="10.5" text-anchor="middle">8×8×2048</text>
    <text x="614" y="280" class="t m mut" font-size="10.5" text-anchor="middle">8×8×1536</text>
    <text x="614" y="128" class="t" font-size="12" text-anchor="middle">feature maps</text>
  </g>

  <!-- head -->
  <g class="t" font-size="11" text-anchor="middle">
    <text x="712" y="128">GAP</text>
    <circle cx="712" cy="150" r="5" fill="#58a6ff"/><circle cx="712" cy="166" r="5" fill="#58a6ff"/>
    <circle cx="712" cy="182" r="5" fill="#58a6ff"/><circle cx="712" cy="198" r="5" fill="#58a6ff"/>
    <circle cx="712" cy="214" r="5" fill="#58a6ff"/>
    <text x="712" y="240" class="m mut" font-size="10">C values</text>

    <text x="790" y="128">Dense 256</text>
    <circle cx="790" cy="150" r="5" fill="#58a6ff"/><circle class="drop" cx="790" cy="166" r="5" fill="#58a6ff" stroke="#58a6ff"/>
    <circle cx="790" cy="182" r="5" fill="#58a6ff"/><circle class="drop" style="animation-delay: .8s" cx="790" cy="198" r="5" fill="#58a6ff" stroke="#58a6ff"/>
    <circle cx="790" cy="214" r="5" fill="#58a6ff"/>
    <text x="790" y="240" class="m mut" font-size="10">ReLU</text>
    <text x="790" y="255" class="m" font-size="10" style="fill:#d29922">Dropout 0.2</text>

    <text x="870" y="128">Dense 128</text>
    <circle cx="870" cy="158" r="5" fill="#58a6ff"/><circle cx="870" cy="174" r="5" fill="#58a6ff"/>
    <circle class="drop" style="animation-delay: .4s" cx="870" cy="190" r="5" fill="#58a6ff" stroke="#58a6ff"/><circle cx="870" cy="206" r="5" fill="#58a6ff"/>
    <text x="870" y="240" class="m mut" font-size="10">ReLU</text>
    <text x="870" y="255" class="m" font-size="10" style="fill:#d29922">Dropout 0.1</text>

    <text x="950" y="128">Dense 7</text>
    <circle cx="950" cy="138" r="5" fill="#58a6ff"/><circle cx="950" cy="154" r="5" fill="#58a6ff"/>
    <circle cx="950" cy="170" r="5" fill="#58a6ff"/><circle cx="950" cy="186" r="5" fill="#58a6ff"/>
    <circle class="win" cx="950" cy="202" r="5" fill="#58a6ff"/><circle cx="950" cy="218" r="5" fill="#58a6ff"/>
    <circle cx="950" cy="234" r="5" fill="#58a6ff"/>
    <text x="950" y="255" class="m mut" font-size="10">softmax</text>
  </g>
  <g class="t m" font-size="11">
    <text x="972" y="142">0 AKIEC</text><text x="972" y="158">1 BCC</text><text x="972" y="174">2 BKL</text>
    <text x="972" y="190">3 DF</text><text x="972" y="206">4 MEL</text><text x="972" y="222">5 NV</text><text x="972" y="238">6 VASC</text>
  </g>
  <text x="1060" y="190" class="t mut" font-size="11">argmax →</text>
  <text x="1060" y="206" class="t mut" font-size="11">diagnosis</text>

  <circle class="pulse" r="9" fill="url(#pulse)"><animateMotion dur="4s" repeatCount="indefinite" path="M140 185 H950"/></circle>
  <circle class="pulse" r="9" fill="url(#pulse)"><animateMotion dur="4s" begin="1.33s" repeatCount="indefinite" path="M140 185 H950"/></circle>
  <circle class="pulse" r="9" fill="url(#pulse)"><animateMotion dur="4s" begin="2.66s" repeatCount="indefinite" path="M140 185 H950"/></circle>

  <!-- parameter table: values measured with TensorFlow 2.20 / Keras 3 -->
  <g class="t" font-size="12.5">
    <rect x="30" y="318" width="1140" height="124" rx="10" fill="#161b22" stroke="#30363d"/>
    <g font-weight="700">
      <text x="50" y="344">backbone</text><text x="250" y="344">input</text><text x="350" y="344">feature map</text>
      <text x="490" y="344">total params</text><text x="640" y="344">head params</text><text x="790" y="344">layer picked by compute_gradcam</text>
    </g>
    <g class="m">
      <text x="50" y="370">EfficientNetB3</text><text x="250" y="370">224</text><text x="350" y="370">7×7×1536</text>
      <text x="490" y="370">11,210,806</text><text x="640" y="370">427,271</text><text x="790" y="370">top_conv · 7×7×1536</text>
      <text x="50" y="394">InceptionV3</text><text x="250" y="394">299</text><text x="350" y="394">8×8×2048</text>
      <text x="490" y="394">22,361,127</text><text x="640" y="394">558,343</text><text x="790" y="394">conv2d_93 · 8×8×192</text>
      <text x="50" y="418">InceptionResNetV2</text><text x="250" y="418">299</text><text x="350" y="418">8×8×1536</text>
      <text x="490" y="418">54,764,007</text><text x="640" y="418">427,271</text><text x="790" y="418">conv_7b_ac · 8×8×1536</text>
    </g>
  </g>
</svg>
